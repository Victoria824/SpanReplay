---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: spanreplay
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: spanreplay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
      app.kubernetes.io/part-of: spanreplay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: spanreplay
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: service
          image: ghcr.io/victoria824/spanreplay:0.1.0
          env:
            - { name: SERVICE_NAME, value: api-gateway }
            - { name: PORT, value: "4000" }
            - { name: AGENT_SERVICE_URL, value: "http://agent-service:4001" }
            - { name: REPLAY_DIR, value: /app/data/replays }
            - { name: NODE_ENV, value: production }
            - { name: DEPLOYMENT_ENVIRONMENT, value: kubernetes }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318" }
            - { name: SPANREPLAY_REDACT_CONTENT, value: "true" }
            - { name: CORS_ORIGIN, value: "http://spanreplay.local,https://spanreplay.example.com" }
          ports:
            - { name: http, containerPort: 4000 }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: "1", memory: 256Mi }
          volumeMounts:
            - name: replays
              mountPath: /app/data/replays
      volumes:
        - name: replays
          persistentVolumeClaim:
            claimName: replay-records
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: spanreplay
spec:
  selector:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: spanreplay
  ports:
    - { name: http, port: 4000, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: replay-console
  namespace: spanreplay
  labels:
    app.kubernetes.io/name: replay-console
    app.kubernetes.io/part-of: spanreplay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: replay-console
      app.kubernetes.io/part-of: spanreplay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: replay-console
        app.kubernetes.io/part-of: spanreplay
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: ghcr.io/victoria824/spanreplay-console:0.1.0
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 250m, memory: 96Mi }
          volumeMounts:
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: replay-console
  namespace: spanreplay
spec:
  selector:
    app.kubernetes.io/name: replay-console
    app.kubernetes.io/part-of: spanreplay
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spanreplay
  namespace: spanreplay
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  rules:
    - host: spanreplay.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: replay-console
                port:
                  name: http
