apiVersion: v1
kind: ConfigMap
metadata: { name: otel-collector-config, namespace: spanreplay }
data:
  config.yaml: |
    extensions:
      health_check: { endpoint: 0.0.0.0:13133 }
      file_storage:
        directory: /var/lib/otelcol/storage
        create_directory: true
        timeout: 10s
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      memory_limiter: { check_interval: 1s, limit_mib: 384, spike_limit_mib: 96 }
      resource:
        attributes:
          - { key: platform, value: spanreplay, action: upsert }
      batch: { send_batch_size: 512, timeout: 2s }
    exporters:
      otlphttp/backend:
        endpoint: ${env:OTEL_BACKEND_ENDPOINT}
        sending_queue:
          enabled: true
          num_consumers: 8
          queue_size: 2048
          storage: file_storage
        retry_on_failure:
          enabled: true
          initial_interval: 1s
          max_interval: 30s
          max_elapsed_time: 10m
      prometheus: { endpoint: 0.0.0.0:8889, namespace: spanreplay }
    service:
      extensions: [health_check, file_storage]
      telemetry:
        metrics:
          level: detailed
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
                    without_type_suffix: true
                    without_units: true
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlphttp/backend]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [prometheus, otlphttp/backend]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: otel-collector, namespace: spanreplay }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector: { matchLabels: { app.kubernetes.io/name: otel-collector } }
      containers:
        - name: collector
          env:
            - { name: OTEL_BACKEND_ENDPOINT, value: "http://datadog-agent.datadog.svc.cluster.local:4318" }
          ports:
            - { name: health, containerPort: 13133 }
          readinessProbe: { httpGet: { path: /, port: health }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /, port: health }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - { name: storage, mountPath: /var/lib/otelcol }
      volumes:
        - name: storage
          emptyDir: { sizeLimit: 1Gi }
