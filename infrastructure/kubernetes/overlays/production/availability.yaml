apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: api-gateway, namespace: spanreplay }
spec: { minAvailable: 1, selector: { matchLabels: { app.kubernetes.io/name: api-gateway } } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: agent-service, namespace: spanreplay }
spec: { minAvailable: 1, selector: { matchLabels: { app.kubernetes.io/name: agent-service } } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: retrieval-service, namespace: spanreplay }
spec: { minAvailable: 1, selector: { matchLabels: { app.kubernetes.io/name: retrieval-service } } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: otel-collector, namespace: spanreplay }
spec: { minAvailable: 1, selector: { matchLabels: { app.kubernetes.io/name: otel-collector } } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: api-gateway, namespace: spanreplay }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api-gateway }
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
    scaleUp: { stabilizationWindowSeconds: 30, policies: [{ type: Percent, value: 100, periodSeconds: 60 }] }
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: agent-service, namespace: spanreplay }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: agent-service }
  minReplicas: 2
  maxReplicas: 20
  behavior: { scaleDown: { stabilizationWindowSeconds: 300 } }
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: retrieval-service, namespace: spanreplay }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: retrieval-service }
  minReplicas: 2
  maxReplicas: 20
  behavior: { scaleDown: { stabilizationWindowSeconds: 300 } }
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: otel-collector, namespace: spanreplay }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: otel-collector }
  minReplicas: 2
  maxReplicas: 6
  behavior: { scaleDown: { stabilizationWindowSeconds: 600 } }
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
