name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: npm run demo

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose model
        run: docker compose config --quiet
      - name: Build application images
        run: |
          docker build --tag spanreplay:ci .
          docker build --file Dockerfile.console --tag spanreplay-console:ci .
      - name: Start service path
        run: docker compose up --detach --build retrieval-service agent-service api-gateway replay-console otel-collector
      - name: Exercise workflow and replay APIs
        run: |
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://localhost:4000/health
          curl --fail http://localhost:4000/api/workflows \
            --header 'content-type: application/json' \
            --data '{"question":"How should we respond to a provider timeout?","scenario":"healthy"}' \
            --output /tmp/spanreplay-workflow.json
          node --input-type=module --eval "const r=JSON.parse(await (await import('node:fs/promises')).readFile('/tmp/spanreplay-workflow.json')); if(r.status!=='completed'||!/^[a-f0-9]{32}$/.test(r.traceId)) process.exit(1); console.log(r.traceId)"
          curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://localhost:4173/
      - name: Service diagnostics
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down --volumes

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - name: Terraform format
        working-directory: infrastructure/terraform/datadog
        run: terraform fmt -check -recursive
      - name: Terraform initialize
        working-directory: infrastructure/terraform/datadog
        run: terraform init -backend=false
      - name: Terraform validate
        working-directory: infrastructure/terraform/datadog
        run: terraform validate
