name: Bug report
description: Report a reproducible problem in SpanReplay.
title: "[bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, raw prompts, private traces, or customer data.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include sanitized steps, scenario, and relevant configuration.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node, Docker, operating system, and observability backend.
    validations:
      required: true

