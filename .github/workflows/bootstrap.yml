name: Bootstrap repository source

on:
  push:
    branches: [main]
    paths:
      - ".spanreplay-bootstrap.tar.gz"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .spanreplay-bootstrap.tar.gz
          tar -xzf .spanreplay-bootstrap.tar.gz
          rm .spanreplay-bootstrap.tar.gz
          rm .github/workflows/bootstrap.yml
      - name: Publish source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build SpanReplay production AI observability starter kit"
          git push origin HEAD:main
