apiVersion: v1
kind: Namespace
metadata:
  name: spanreplay
  labels:
    app.kubernetes.io/part-of: spanreplay
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: spanreplay
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 192
        spike_limit_mib: 48
      resource:
        attributes:
          - key: platform
            value: spanreplay
            action: upsert
      batch: {}
    exporters:
      debug:
        verbosity: basic
      prometheus:
        endpoint: 0.0.0.0:8889
        namespace: spanreplay
    service:
      telemetry:
        metrics:
          level: detailed
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
                    without_type_suffix: true
                    without_units: true
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [prometheus]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: spanreplay
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: spanreplay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
      app.kubernetes.io/part-of: spanreplay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/part-of: spanreplay
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.157.0
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: metrics, containerPort: 8889 }
            - { name: internal-metrics, containerPort: 8888 }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: spanreplay
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: spanreplay
spec:
  selector:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: spanreplay
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: metrics, port: 8889, targetPort: metrics }
    - { name: internal-metrics, port: 8888, targetPort: internal-metrics }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: replay-records
  namespace: spanreplay
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retrieval-service
  namespace: spanreplay
  labels:
    app.kubernetes.io/name: retrieval-service
    app.kubernetes.io/part-of: spanreplay
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: retrieval-service
      app.kubernetes.io/part-of: spanreplay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: retrieval-service
        app.kubernetes.io/part-of: spanreplay
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: service
          image: ghcr.io/victoria824/spanreplay:0.1.0
          env:
            - { name: SERVICE_NAME, value: retrieval-service }
            - { name: PORT, value: "4002" }
            - { name: NODE_ENV, value: production }
            - { name: DEPLOYMENT_ENVIRONMENT, value: kubernetes }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector:4318" }
            - { name: SPANREPLAY_REDACT_CONTENT, value: "true" }
          ports:
            - { name: http, containerPort: 4002 }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: "1", memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: retrieval-service
  namespace: spanreplay
spec:
  selector:
    app.kubernetes.io/name: retrieval-service
    app.kubernetes.io/part-of: spanreplay
  ports:
    - { name: http, port: 4002, targetPort: http }
---
